name: Restore FootDeals OG asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact deployed OG image if missing
        shell: bash
        run: |
          if [ -f assets/og-footdeals.jpg ]; then
            echo "OG image already present"
            exit 0
          fi
          mkdir -p assets
          curl --fail --location --silent --show-error https://footdeals.netlify.app/assets/og-footdeals.jpg -o assets/og-footdeals.jpg
          test "$(git hash-object assets/og-footdeals.jpg)" = "c0f8a4d2b2fe80f499e013299eedc2e214d2af3e"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og-footdeals.jpg
          git commit -m "Restore exact FootDeals OG image"
          git push
