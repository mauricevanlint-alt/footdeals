name: Validate FootDeals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate project files
        shell: python
        run: |
          from pathlib import Path
          import json, re, sys
          from urllib.parse import urlparse

          root = Path('.')
          required = [
              'index.html', 'app.js', 'styles.css', 'deals.json',
              'manifest.webmanifest', 'service-worker.js', 'netlify.toml',
              'netlify/functions/admin.mts', 'netlify/functions/deals.mts',
              'netlify/functions/health.mts', 'netlify/functions/stats.mts',
          ]
          missing = [p for p in required if not (root / p).exists()]
          if missing:
              print('Missing required files:', ', '.join(missing))
              sys.exit(1)

          with open('deals.json', encoding='utf-8') as f:
              deals = json.load(f)
          if not isinstance(deals, list):
              raise SystemExit('deals.json must contain a list')
          ids = [d.get('id') for d in deals]
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate deal IDs found')
          required_deal_keys = {'id', 'cat', 'brand', 'name', 'merchant', 'price', 'url', 'status'}
          for i, deal in enumerate(deals):
              absent = sorted(required_deal_keys - set(deal))
              if absent:
                  raise SystemExit(f'Deal #{i} missing keys: {absent}')

              base_url = str(deal.get('url') or '')
              parsed = urlparse(base_url)
              if parsed.scheme not in ('http', 'https') or not parsed.netloc:
                  raise SystemExit(f'Deal #{i} has invalid merchant URL')

              affiliate_url = str(deal.get('affiliate_url') or '').strip()
              affiliate = bool(deal.get('affiliate'))
              if affiliate_url:
                  parsed_aff = urlparse(affiliate_url)
                  if parsed_aff.scheme not in ('http', 'https') or not parsed_aff.netloc:
                      raise SystemExit(f'Deal #{i} has invalid affiliate_url')
                  if not affiliate:
                      raise SystemExit(f'Deal #{i} has affiliate_url but affiliate is false')
              if affiliate and not affiliate_url:
                  raise SystemExit(f'Deal #{i} is marked affiliate but has no affiliate_url')

          broken = []
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              for attr, value in re.findall(r'\b(href|src)=["\']([^"\']+)', text, flags=re.I):
                  if value.startswith(('http://', 'https://', 'mailto:', 'tel:', '#', 'data:', 'javascript:', '/api/', '/out/', '/d/')):
                      continue
                  clean = value.split('?', 1)[0].split('#', 1)[0]
                  if clean and not (root / clean.lstrip('/')).exists():
                      broken.append(f'{page}: {attr}={value}')
          if broken:
              print('Broken internal references:')
              print('\n'.join(broken))
              sys.exit(1)

          print(f'Validation OK: {len(deals)} deals, affiliate links consistent, no duplicate IDs, no broken internal references.')
