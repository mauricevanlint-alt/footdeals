<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirection — FootDeals</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap" style="padding:80px 0;max-width:680px"><div class="section-eyebrow">FootDeals</div><h1 style="font-size:54px;letter-spacing:-3px">Redirection sécurisée.</h1><p class="section-copy" id="msg">Vérification du lien…</p><a class="btn btn-primary" href="index.html">Retour à FootDeals</a></main><script>
const id=Number(new URLSearchParams(location.search).get('id'));
async function deals(){try{const r=await fetch('/api/deals',{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j.deals))return j.deals}}catch{}try{const r=await fetch('deals.json',{cache:'no-store'});if(r.ok)return await r.json()}catch{}return[]}
deals().then(ds=>{const d=ds.find(x=>Number(x.id)===id);if(!d||!d.url){document.getElementById('msg').textContent='Cette offre ne possède pas de lien marchand actif.';return}try{const u=new URL(d.url);if(!['http:','https:'].includes(u.protocol))throw 0;location.replace(u.href)}catch{document.getElementById('msg').textContent='Lien marchand invalide.'}}).catch(()=>document.getElementById('msg').textContent='Impossible de vérifier ce lien.');
</script></body></html>
